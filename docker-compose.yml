version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: iist_career_db
    environment:
      POSTGRES_USER: iist_user
      POSTGRES_PASSWORD: iist_pass
      POSTGRES_DB: iist_career_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iist_user -d iist_career_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: iist_career_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iist_career_app
    environment:
      DATABASE_URL: "postgresql://iist_user:iist_pass@postgres:5432/iist_career_db"
      AUTH_SECRET: "iist-career-portal-secret-key-change-in-production-32chars"
      AUTH_URL: "http://localhost:3000"
      NEXTAUTH_URL: "http://localhost:3000"
      STORAGE_DRIVER: "s3"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      AWS_REGION: "us-east-1"
      AWS_S3_BUCKET: "iist-career-portal"
      AWS_ENDPOINT_URL: "http://minio:9000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
